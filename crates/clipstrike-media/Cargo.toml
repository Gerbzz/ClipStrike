[package]
name = "clipstrike-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gstreamer-backend = [
    "dep:glib",
    "dep:gstreamer",
    "dep:gstreamer-video",
    "dep:gstreamer-app",
    "dep:gstreamer-gl",
    "dep:gstreamer-pbutils",
    "clipstrike-audio/gstreamer-backend",
]
ai-features = ["dep:opencv"]

[dependencies]
clipstrike-core = { path = "../clipstrike-core" }
clipstrike-render = { path = "../clipstrike-render" }
clipstrike-audio = { path = "../clipstrike-audio" }
log.workspace = true
bytemuck = "1.21"
futures.workspace = true
image.workspace = true
serde.workspace = true
wgpu.workspace = true
opencv = { version = "0.94", optional = true }
glib = { workspace = true, optional = true }
gstreamer = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-gl = { workspace = true, optional = true }
gstreamer-pbutils = { workspace = true, optional = true }
rayon.workspace = true
tokio.workspace = true
